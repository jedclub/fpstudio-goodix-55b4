name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-leaked-data:
    name: Privacy and release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject absolute user-home paths
        run: |
          if grep -rnE "/home/[a-z][a-z0-9_-]*" \
               --include='*.md' --include='*.cpp' --include='*.h' \
               --include='*.sh' --include='*.py' --include='*.ts' . \
               | grep -v 'FPSTUDIO_SOURCE_DIR\|CMAKE_SOURCE_DIR'; then
            echo "::error::Found a literal /home/<user> path in a tracked file"
            exit 1
          fi

      - name: Reject biometric and credential artifacts
        run: |
          forbidden='(\.pgm$|\.fp$|\.qm$|\.pem$|\.p12$|\.pfx$|\.key$|\.token$|(^|/)(\.env|credentials\.json|auth\.json|token\.json)$)'
          if git ls-files | grep -Ei "$forbidden"; then
            echo "::error::A biometric, credential, or generated artifact is tracked"
            exit 1
          fi

      - name: Allow only documented public ridge illustrations
        run: |
          allowed="README.md ridges-correct-geometry.png ridges-wrong-geometry.png normalisation-minmax.png normalisation-percentile.png"
          bad=0
          for f in captures/*; do
            name=$(basename "$f")
            echo "$allowed" | tr ' ' '\n' | grep -qx "$name" || {
              echo "::error::Unexpected file in captures/: $name"; bad=1;
            }
          done
          exit "$bad"

  driver-patches:
    name: Driver package builds from the pinned source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git meson pkgconf gobject-introspection gtk-doc doctest glib2-devel \
            libgusb openssl pixman nss libgudev opencv sudo

      - name: Build the package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd src/driver && makepkg -f --noconfirm --nocheck'

  fpstudio:
    name: Build and test FPStudio
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build and software-Vulkan dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja qt6-base qt6-tools pkgconf glib2 libfprint \
            vulkan-headers vulkan-icd-loader vulkan-swrast glslang

      - name: Configure
        run: cmake -S src/fpstudio -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run the full CTest suite with Lavapipe
        env:
          QT_QPA_PLATFORM: offscreen
          FPSTUDIO_ALLOW_SOFTWARE_VULKAN: "1"
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          ctest --test-dir build --output-on-failure

      - name: Smoke-test CLI localisation and diagnostics
        run: |
          ./build/fpstudio --help
          test "$(./build/fpstudio --lang ko --tr 'Sensor ready')" = "센서 준비 완료"
          ./build/fpstudio --cli devices

  translations:
    name: Translation catalogues are complete
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install lupdate
        run: pacman -Syu --noconfirm --needed qt6-tools qt6-declarative

      - name: lupdate must find nothing new
        run: |
          cd src/fpstudio
          cp -r translations /tmp/translations.before
          /usr/lib/qt6/bin/lupdate src/ -ts translations/fpstudio_*.ts -no-obsolete
          if ! diff -rq /tmp/translations.before translations; then
            echo "::error::Source strings changed without updating the .ts files"
            exit 1
          fi

      - name: No catalogue may have an unfinished translation
        run: |
          cd src/fpstudio/translations
          fail=0
          for f in fpstudio_*.ts; do
            n=$(grep -c 'type="unfinished"' "$f" || true)
            if [ "$n" -gt 0 ]; then
              echo "::error::$f has $n untranslated string(s)"
              fail=1
            fi
          done
          exit "$fail"
