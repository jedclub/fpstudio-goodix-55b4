name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-leaked-data:
    name: Privacy and release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject absolute user-home paths
        run: |
          if grep -rnE "/home/[a-z][a-z0-9_-]*" \
               --include='*.md' --include='*.cpp' --include='*.h' \
               --include='*.sh' --include='*.py' --include='*.ts' . \
               | grep -v 'FPSTUDIO_SOURCE_DIR\|CMAKE_SOURCE_DIR'; then
            echo "::error::Found a literal /home/<user> path in a tracked file"
            exit 1
          fi

      - name: Reject biometric and credential artifacts
        run: |
          forbidden='(\.pgm$|\.fp$|\.qm$|\.pem$|\.p12$|\.pfx$|\.key$|\.token$|(^|/)(\.env|credentials\.json|auth\.json|token\.json)$)'
          if git ls-files | grep -Ei "$forbidden"; then
            echo "::error::A biometric, credential, or generated artifact is tracked"
            exit 1
          fi

      - name: Reject sudo shell and nested-PTY wrappers
        run: |
          if git grep -nE \
               'function[[:space:]]+sudo|alias[[:space:]]+sudo=|pty\.spawn\([^)]*sudo' \
               -- '*.fish' '*.sh' '*.py'; then
            echo "::error::Authentication must integrate through PAM, not a sudo shell or PTY wrapper"
            exit 1
          fi

      - name: Allow only documented public ridge illustrations
        run: |
          allowed="README.md ridges-correct-geometry.png ridges-wrong-geometry.png normalisation-minmax.png normalisation-percentile.png"
          bad=0
          for f in captures/*; do
            name=$(basename "$f")
            echo "$allowed" | tr ' ' '\n' | grep -qx "$name" || {
              echo "::error::Unexpected file in captures/: $name"; bad=1;
            }
          done
          exit "$bad"

  driver-patches:
    name: Driver package builds from the pinned source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install package build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git meson pkgconf gobject-introspection gtk-doc doctest glib2-devel \
            libgusb openssl pixman nss libgudev opencv sudo

      - name: Validate unified driver patch syntax
        run: |
          for patch_file in src/driver/patches/*.patch; do
            git apply --numstat "$patch_file" >/dev/null
          done

      - name: Build the package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd src/driver && makepkg -f --noconfirm --nocheck'

  fpstudio:
    name: Build and test FPStudio
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build and software-Vulkan dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja qt6-base qt6-tools pkgconf glib2 libfprint \
            vulkan-headers vulkan-icd-loader vulkan-swrast glslang \
            pam systemd python-dbus python-gobject dbus

      - name: Configure
        run: cmake -S src/fpstudio -B build -G Ninja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run the full CTest suite with Lavapipe
        env:
          QT_QPA_PLATFORM: offscreen
          FPSTUDIO_ALLOW_SOFTWARE_VULKAN: "1"
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          ctest --test-dir build --output-on-failure

      - name: Test PAM terminal conversation and isolated fingerprint bus
        run: |
          python src/pam/test_tty.py build/pam
          python src/pam/test_worker_bus.py build/pam/fpstudio-fprint-worker
          PYTHONPATH=tools python -m unittest \
            tools/test_auth_install.py \
            tools/test_dual_auth_install.py \
            tools/test_auth_log_report.py

      - name: Smoke-test CLI localisation and diagnostics
        run: |
          ./build/fpstudio --help
          test "$(./build/fpstudio --lang ko --tr 'Sensor ready')" = "센서 준비 완료"
          ./build/fpstudio --cli devices

  translations:
    name: Translation catalogues are complete
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install lupdate
        run: pacman -Syu --noconfirm --needed qt6-tools qt6-declarative

      - name: lupdate must find nothing new
        run: |
          cd src/fpstudio
          cp -r translations /tmp/translations.before
          /usr/lib/qt6/bin/lupdate src/ -ts translations/fpstudio_*.ts -no-obsolete
          # Compare the strings, not where they happen to live. A line="123"
          # attribute moves whenever anything above it in the source moves, so
          # diffing it verbatim fails the build for edits that add no strings.
          # The step runs under plain sh, so normalise into files rather than
          # using process substitution.
          for f in translations/fpstudio_*.ts; do
            b=/tmp/translations.before/$(basename "$f")
            sed 's/ line="[0-9]*"//' "$b" > /tmp/before.ts
            sed 's/ line="[0-9]*"//' "$f" > /tmp/after.ts
            if ! diff -u /tmp/before.ts /tmp/after.ts; then
              echo "::error::Source strings changed without updating $f"
              exit 1
            fi
          done

      - name: No user-visible string may bypass the catalogues
        run: |
          cd src/fpstudio
          # lupdate only sees tr() and QCoreApplication::translate(), so a
          # QStringLiteral holding Korean is invisible to it: the catalogue
          # check passes, every locale shows Korean, and nobody finds out. That
          # is how 81 strings in the enrolment window ended up untranslatable.
          # i18n.cpp is exempt because its Korean is an endonym in the language
          # picker, which must not be translated.
          if grep -rn --include=*.cpp --include=*.h \
               'QStringLiteral("[^"]*[가-힣]' src/ | grep -v '^src/i18n.cpp:'; then
            echo "::error::Korean literal outside tr() - it cannot be translated"
            exit 1
          fi

      - name: No catalogue may have an unfinished translation
        run: |
          cd src/fpstudio/translations
          fail=0
          for f in fpstudio_*.ts; do
            n=$(grep -c 'type="unfinished"' "$f" || true)
            if [ "$n" -gt 0 ]; then
              echo "::error::$f has $n untranslated string(s)"
              fail=1
            fi
          done
          exit "$fail"
