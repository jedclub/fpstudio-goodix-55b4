name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify-release:
    name: Rebuild and test the tagged source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install build and software-Vulkan dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            cmake ninja qt6-base qt6-tools pkgconf glib2 libfprint \
            vulkan-headers vulkan-icd-loader vulkan-swrast glslang \
            pam systemd python-dbus python-gobject dbus

      - name: Configure, build and test
        env:
          QT_QPA_PLATFORM: offscreen
          FPSTUDIO_ALLOW_SOFTWARE_VULKAN: "1"
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          # Two builds: one that counts which way the branches went, then the
          # real one compiled against what was counted. The training in
          # between is the test suite, which drives the PAM conversation, the
          # frame selector, the placement search and the matcher end to end.
          # It uses no fingerprint data, so it runs here as it does anywhere.
          profile="$PWD/pgo-data"
          cmake -S src/fpstudio -B build-pgo-gen -G Ninja -DBUILD_TESTING=ON \
                -DFPSTUDIO_PGO=GENERATE -DFPSTUDIO_PGO_DIR="$profile"
          cmake --build build-pgo-gen --parallel
          # A failing test still records the paths it took, so training does
          # not stop here - but a release must not ship from a red suite, and
          # the verification run below is the one that gates it.
          ctest --test-dir build-pgo-gen --output-on-failure || true
          test -n "$(find "$profile" -name '*.gcda' -print -quit)"

          cmake -S src/fpstudio -B build -G Ninja -DBUILD_TESTING=ON \
                -DFPSTUDIO_PGO=USE -DFPSTUDIO_PGO_DIR="$profile"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          python src/pam/test_tty.py build/pam
          python src/pam/test_worker_bus.py build/pam/fpstudio-fprint-worker
          PYTHONPATH=tools python -m unittest \
            tools/test_auth_install.py \
            tools/test_dual_auth_install.py \
            tools/test_auth_log_report.py

      - name: Build relocatable application bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          stage="$RUNNER_TEMP/fpstudio-stage"
          archive="fpstudio-${version}-linux-x86_64-release.tar.zst"
          DESTDIR="$stage" cmake --install build --prefix /usr --strip
          tar --zstd --sort=name --mtime="UTC 1970-01-01" \
            --owner=0 --group=0 --numeric-owner \
            -cf "$archive" -C "$stage" .
          sha256sum "$archive" > SHA256SUMS.binary

      - name: Upload tested application bundle
        uses: actions/upload-artifact@v4
        with:
          name: fpstudio-release-bundle
          path: |
            fpstudio-*-linux-x86_64-release.tar.zst
            SHA256SUMS.binary
          if-no-files-found: error

  publish-source-release:
    name: Publish source archive and checksum
    runs-on: ubuntu-latest
    needs: verify-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested application bundle
        uses: actions/download-artifact@v4
        with:
          name: fpstudio-release-bundle

      - name: Validate the tag and release note
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$TAG" = "v$version"
          test -n "$version"
          test -f "docs/releases/${TAG}.md"
          grep -Fq "project(fpstudio VERSION ${version}" src/fpstudio/CMakeLists.txt

      - name: Build source archive and checksum
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="fpstudio-goodix-55b4-${version}"
          git archive --format=tar.gz --prefix="${base}/" --output="${base}.tar.gz" "$TAG"
          sha256sum "${base}.tar.gz" > SHA256SUMS
          cat SHA256SUMS.binary >> SHA256SUMS
          echo "archive=${base}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" fpstudio-*-linux-x86_64-release.tar.zst SHA256SUMS \
            --title "FPStudio $TAG" \
            --notes-file "docs/releases/${TAG}.md"
