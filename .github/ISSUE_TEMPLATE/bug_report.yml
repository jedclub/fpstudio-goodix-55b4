name: Bug report
description: Report a reproducible Goodix 27c6:55b4 setup, capture or authentication problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FPStudio. **Never attach fingerprint images/templates, passwords, PSKs, device keys, authentication backups or private research sessions.** Use a private security advisory for vulnerabilities.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed biometric data, credentials, secrets, home-directory paths and unrelated personal information.
          required: true
        - label: This is not a security vulnerability or authentication bypass.
          required: true
  - type: input
    id: version
    attributes:
      label: FPStudio version or commit
      placeholder: v0.2.9 or a commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Laptop model, distribution, kernel and desktop version.
      placeholder: ThinkPad L14 Gen 1; Arch Linux; Linux 6.x; Plasma 6.x
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: USB identity
      description: Output of `lsusb -d 27c6:55b4` with serial numbers removed.
      placeholder: Bus … ID 27c6:55b4 Shenzhen Goodix Technology Co.,Ltd.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected path
      options:
        - Setup wizard / driver
        - Enrolment or live capture
        - sudo / terminal PAM
        - KDE lock screen / Polkit
        - TTY login
        - Vulkan matcher
        - Localisation
        - Build or packaging
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the shortest reliable sequence and how often it fails.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Privacy-safe diagnostics
      description: Paste the output of `fpstudio-auth-report`, not raw biometric data or unredacted logs.
      render: text
