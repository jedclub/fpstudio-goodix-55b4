# Cap how much of the journal a misbehaving driver can destroy.
#
# Separate from 60-fpstudio-gpu.conf on purpose: that one says where to load the
# matcher from and belongs to the GPU authentication install, while this is
# damage control and should survive that being rolled back.
#
# The bug that prompted this is fixed at source - see
# docs/23-fprintd-runaway.md and patch 0020, which bound the driver's retry
# loop so it can no longer spin. This is not a second attempt at that fix and
# does not detect or recover anything. It limits one specific kind of
# collateral damage: a driver fault that is noisy in a tight loop.
#
# Why that is worth two lines. During the incident the driver wrote ~125,000
# identical warnings per second. journald suppressed ~3.7 million messages per
# 30 seconds and still rotated two days of records out of the ring buffer -
# including the authentication history that docs/22-auth-observability.md is
# built on, and that `fpstudio-auth-report` reads. The daemon was recoverable
# by restarting it; the evidence needed to understand why was already gone.
#
# So the loop is fixed, and this makes sure that no future fault of the same
# shape - in this driver or any other code fprintd loads - can take the
# logs with it before anyone notices.
#
# 500 messages per 10s is far above anything fprintd produces in normal use - a
# full enrolment is a few dozen lines - and four orders of magnitude below a
# runaway loop.

[Service]
LogRateLimitIntervalSec=10s
LogRateLimitBurst=500
